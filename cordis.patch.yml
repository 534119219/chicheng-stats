# chicheng-stats bundle patch
#
# Mounts the usage-stats plugin into the profile loader. `name` must resolve
# from the profile node_modules (installed via `dsh plugin --profile <name>
# add <this package>`), and the client half is served by the host at
# /plugins/chicheng-stats/client.js.
- insert:
    - id: chicheng-stats
      name: 'chicheng-stats'
